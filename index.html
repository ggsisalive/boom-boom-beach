<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#38b6ff" />
    <meta name="description" content="Paste a YouTube link and shoot to the beat. A hip hop rhythm shooter on the beach, starring Toast the cat." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Beat Beach</title>
    <style>#boot{z-index:50;color:#fff;letter-spacing:2px;text-shadow:0 2px 6px #003c8c73;background:linear-gradient(#38b6ff 0%,#9fe3ff 55%,#fff1c9 100%);place-items:center;font:700 22px system-ui,sans-serif;transition:opacity .4s;display:grid;position:fixed;inset:0}#boot.gone{opacity:0;pointer-events:none}#boot .sun{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd84a 55%,#ff9f2e);border-radius:50%;width:64px;height:64px;margin:0 auto 14px;animation:.625s ease-in-out infinite alternate bob;box-shadow:0 0 40px #ffe27a}@keyframes bob{to{transform:translateY(-8px)scale(1.04)}}</style>
    <script type="module" crossorigin src="./main-D-5_VvsH.js"></script>
    <link rel="stylesheet" crossorigin href="./main-BylLTc8D.css">
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="0"></canvas>
      <div id="nowPlaying" class="hidden">
        <div class="np-top"><span class="np-dot"></span>NOW PLAYING<span class="np-bpm"></span></div>
        <div id="ytHost"></div>
        <canvas id="npViz" width="384" height="96"></canvas>
      </div>
    </div>
    <div id="boot"><div><div class="sun"></div>BEAT BEACH</div></div>
    <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;font:700 20px sans-serif">Beat Beach needs JavaScript turned on.</p></noscript>
  </body>
</html>
